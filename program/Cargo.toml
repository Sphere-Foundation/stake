[package]
name = "spherenet-stake-program"
version = { workspace = true }
description = "SphereNet BPF Stake Program with Validator Whitelist"
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = false

[dependencies]
bincode = "1.3.3"
solana-account-info = { version = "3.0.0", features = ["bincode"] }
solana-clock = "3.0.0"
solana-cpi = "3.0.0"
solana-instruction-error = "2.0.0"
solana-msg = "3.0.0"
solana-native-token = "3.0.0"
solana-program-entrypoint = "3.0.0"
solana-program-error = "3.0.0"
solana-pubkey = "3.0.0"
solana-rent = "3.0.0"
spherenet-stake-interface = { workspace = true, features = ["bincode", "borsh", "sysvar"] }
solana-sysvar = "3.0.0"
solana-sysvar-id = "3.0.0"
solana-vote-interface = { version = "4.0.4", features = ["bincode"] }
serde = "1.0"
solana-sdk-ids = "3.0.0"
spherenet-validator-whitelist-interface = "0.2.0"

# Optional dependencies for helpers feature
solana-genesis-config = { version = "3.0.0", optional = true }
solana-account = { version = "3.2.0", optional = true, features = ["bincode"] }
solana-keypair = { version = "3.0.0", optional = true }
solana-signer = { version = "3.0.0", optional = true }
solana-instruction = { version = "3.0.0", optional = true }

# solana-program (via spherenet-validator-whitelist-interface) and solana-keypair
# pull in getrandom 0.2, which needs its `js` backend on wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
agave-feature-set = "3.1.0"
arbitrary = { version = "1.4.2", features = ["derive"] }
assert_matches = "1.5.0"
mollusk-svm = { version = "0.12.0", features = ["all-builtins"] }
proptest = "1.10.0"
rand = "0.9.2"
solana-account = { version = "3.2.0", features = ["bincode"] }
solana-config-interface = { version = "2", features = ["serde"] }
solana-epoch-rewards = "3.0.0"
solana-epoch-schedule = "3.0.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.0"
solana-logger = "3.0.0"
solana-program-binaries = "3.1.12"
solana-program-test = { version = "3.1.12", features = ["agave-unstable-api"] }
solana-sdk-ids = "3.0.0"
solana-signature = "3.2.0"
solana-signer = "3.0.0"
solana-stake-interface = "2"
solana-svm-log-collector = "3.0.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
solana-transaction = "3.0.0"
test-case = "3.3.1"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
helpers = [
    "solana-genesis-config",
    "solana-account",
    "solana-keypair",
    "solana-signer",
    "solana-instruction"
]

[lints]
workspace = true

[package.metadata.solana]
program-id = "Stake11111111111111111111111111111111111111"
